<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="referrer" content="no-referrer">
    <title>AI Challenge — чат</title>
    <link rel="stylesheet" href="style.css?v=week-reset-1">
  </head>
  <body>
    <main class="container">
      <section class="card" aria-labelledby="title">
        <p class="eyebrow">AI Challenge</p>
        <h1 id="title">Чат с агентом</h1>

        <section class="agent-chat" aria-labelledby="chat-title">
          <div class="section-heading">
            <h2 id="chat-title">Диалог</h2>
            <div class="heading-actions">
              <span id="chat-status" class="hint">История сохраняется для этого браузера</span>
              <button id="open-context-settings" class="secondary-button compact-button" type="button" aria-haspopup="dialog">Фильтр</button>
            </div>
          </div>

          <div id="agent-history" class="agent-history" aria-live="polite">
            <p class="hint">История диалога появится здесь после первого сообщения.</p>
          </div>

          <form id="agent-form">
            <label for="agent-message">Сообщение</label>
            <textarea id="agent-message" name="message" rows="4" maxlength="32000" autofocus placeholder="Напишите сообщение…"></textarea>
            <div class="agent-actions">
              <button id="agent-submit" type="submit">Отправить</button>
              <button id="clear-agent-history" class="secondary-button" type="button">Удалить всю историю</button>
            </div>
          </form>

          <p id="status" class="status" aria-live="polite"></p>

          <dialog id="context-settings-dialog" aria-labelledby="context-title">
            <form method="dialog" class="context-settings">
              <div class="dialog-heading">
                <h2 id="context-title">Управление контекстом</h2>
                <button class="icon-button" value="cancel" type="submit" aria-label="Закрыть настройки">×</button>
              </div>
              <label for="context-strategy">Стратегия
                <select id="context-strategy">
                  <option value="sliding_window">Sliding Window</option>
                  <option value="facts">Sticky Facts / Key-Value Memory</option>
                </select>
              </label>
              <label for="recent-messages">Последних сообщений (N)
                <input id="recent-messages" type="number" min="2" max="40" value="10" inputmode="numeric">
              </label>
              <p id="strategy-description" class="hint">В модель отправляются только последние N сообщений. Ранние реплики удаляются.</p>
              <button class="secondary-button dialog-close" value="close" type="submit">Готово</button>
            </form>
          </dialog>
        </section>

        <details class="logs-card">
          <summary>Логи</summary>
          <pre id="request-log">Отправьте сообщение, чтобы увидеть журнал запроса.</pre>
        </details>
      </section>
    </main>
    <script src="app.js?v=week-reset-1"></script>
  </body>
</html>
